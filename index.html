class OrionNebula {
  constructor() {
    this.group = new THREE.Group();
    this.features = [];
    this.time = 0;
    this.clouds = [];
    this.rnd = makeRandom(1304);
    this.cloudTex = cloudSprite(256, 81);
    this.flareTex = flareSprite();

    this.#buildBackground();
    this.#buildEmissionCloud();
    this.#buildPillars();
    this.#buildTrapezium();
    this.#buildFeatures();
  }

  #sprite(size, color, opacity, texture = this.cloudTex) {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texture,
      color: new THREE.Color(color),
      transparent: true,
      opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    sprite.scale.set(size, size, 1);
    return sprite;
  }

  #buildBackground() {
    const positions = [];
    for (let i = 0; i < 5000; i++) {
      const r = 450 + this.rnd() * 160;
      const u = this.rnd() * 2 - 1;
      const a = this.rnd() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      positions.push(r * s * Math.cos(a), r * u, r * s * Math.sin(a));
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const stars = new THREE.Points(geometry, new THREE.PointsMaterial({
      map: starSprite(32), size: 1.25, sizeAttenuation: false,
      color: 0xaec9ff, transparent: true, opacity: 0.8,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    this.group.add(stars);
  }

  #buildEmissionCloud() {
    const colors = ['#e64c7f', '#ff78ae', '#b56bff', '#507dff', '#ffb2c9'];
    for (let i = 0; i < 200; i++) {
      const r = Math.pow(this.rnd(), 0.58) * 30;
      const a = this.rnd() * Math.PI * 2;
      const cloud = this.#sprite(7 + this.rnd() * 16, colors[i % colors.length], 0.035 + this.rnd() * 0.10);
      cloud.position.set(Math.cos(a) * r, gauss(this.rnd) * 4.5, Math.sin(a) * r * 0.48);
      cloud.userData.drift = 0.03 + this.rnd() * 0.12;
      cloud.userData.phase = this.rnd() * Math.PI * 2;
      this.group.add(cloud);
      this.clouds.push(cloud);
    }

    const core = this.#sprite(37, '#ff70a2', 0.12);
    core.scale.y = 0.58;
    this.group.add(core);
  }

  #buildPillars() {
    const positions = [[-11, -7, 2, 17], [-3, -8, 1, 23], [6, -8, 3, 16]];
    for (const [x, y, z, height] of positions) {
      const pillar = new THREE.Group();
      pillar.position.set(x, y, z);
      pillar.rotation.z = (this.rnd() - 0.5) * 0.22;
      for (let i = 0; i < 26; i++) {
        const t = i / 25;
        const cloud = this.#sprite(4.5 + (1 - t) * 5, '#170d1c', 0.3 + this.rnd() * 0.25);
        cloud.position.set(gauss(this.rnd) * 1.2, t * height, gauss(this.rnd) * 1.3);
        pillar.add(cloud);
      }
      this.group.add(pillar);
    }
  }

  #buildTrapezium() {
    const stars = [
      { x: -1.9, y: 1.6, z: 0.8, color: '#b9d5ff', size: 5.4 },
      { x: 2.1, y: 0.7, z: -0.6, color: '#d9e8ff', size: 4.3 },
      { x: 0.5, y: -1.8, z: 1.4, color: '#8cb8ff', size: 3.7 },
      { x: -0.7, y: -0.4, z: -1.8, color: '#e8f1ff', size: 3.2 }
    ];
    for (const star of stars) {
      const sprite = this.#sprite(star.size * 0.62, star.color, 0.8, this.flareTex);
      sprite.position.set(star.x, star.y, star.z);
      sprite.userData.twinkle = this.rnd() * Math.PI * 2;
      this.group.add(sprite);
      this.clouds.push(sprite);
    }
    this.group.add(new THREE.PointLight(0x9fc4ff, 2.1, 80));
    this.group.add(new THREE.AmbientLight(0x5d426e, 0.35));
  }

  #buildFeatures() {
    const add = (id, position, info, color) => {
      const anchor = new THREE.Object3D();
      anchor.position.fromArray(position);
      anchor.userData.info = info;
      this.group.add(anchor);
      const flare = this.#sprite(2.4, color, 0.75, this.flareTex);
      anchor.add(flare);
      this.features.push(anchor);
    };

    add('trapezium', [0, 0, 0], {
      tag: 'CÚMULO ESTELAR', name: 'El Trapecio',
      sub: 'Corazón de la Nebulosa de Orión',
      desc: 'Cuatro estrellas jóvenes y masivas que bañan la nebulosa en radiación ultravioleta. Theta¹ Orionis C domina el grupo y ha excavado una cavidad en la nube de gas.',
      facts: [['Estrellas principales', '4'], ['Tipo dominante', 'O7 V'], ['Edad', '< 1 Ma'], ['Temperatura', '~ 39 000 K']]
    }, '#dceaff');

    add('pillars', [-3, 5, 1], {
      tag: 'COLUMNA MOLECULAR', name: 'Pilares de Orión',
      sub: 'Gas frío y polvo en colapso',
      desc: 'Columnas densas protegidas de la radiación por sus propias capas exteriores. En sus puntas se forman protoestrellas; sus chorros perforan el gas circundante.',
      facts: [['Longitud', '2-4 ly'], ['Temperatura', '10-30 K'], ['Densidad', '> 10⁵ part./cm³'], ['Destino', 'erosión por radiación']]
    }, '#ff9abd');

    add('proplyds', [10, 3, -1], {
      tag: 'DISCOS PROTOPLANETARIOS', name: 'Proplyds',
      sub: 'Sistemas solares en formación',
      desc: 'Más de 180 discos de gas y polvo observados alrededor de estrellas jóvenes. Son sistemas planetarios naciendo bajo la radiación intensa del Trapecio.',
      facts: [['Discos conocidos', '> 180'], ['Diámetro típico', '100-1 000 UA'], ['Edad', '< 1 Ma'], ['Instrumento', 'Hubble / JWST']]
    }, '#9fbaff');
  }

  get pickables() { return this.features; }

  update(dt, timeScale) {
    this.time += dt;
    for (const cloud of this.clouds) {
      if (cloud.userData.drift) cloud.material.rotation += dt * cloud.userData.drift;
      if (cloud.userData.twinkle !== undefined) {
        cloud.material.opacity = 0.72 + Math.sin(this.time * 2.2 + cloud.userData.twinkle) * 0.23;
      }
    }
    this.group.rotation.y += dt * 0.004 * (0.2 + timeScale * 0.02);
  }

  dispose() {
    this.group.traverse(object => {
      object.geometry?.dispose();
      object.material?.dispose();
    });
  }
}

const MEMBERS = [
  {
    id: 'milkyway', name: 'Vía Láctea', type: 'GALAXIA ESPIRAL BARRADA · SBbc',

class LocalGroup {
  constructor() {
    this.group = new THREE.Group();
    this.bodies = [];
    this.cloudTex = cloudSprite(256, 122);
    this.flareTex = flareSprite();
    this.starTex = starSprite(64);
    this.time = 0;
    this.rnd = makeRandom(7331);

    for (const member of MEMBERS) this.#buildGalaxy(member);
    this.#buildFilament();
  }

  #buildGalaxy(data) {
    const group = new THREE.Group();
    group.position.fromArray(data.position);
    group.rotation.z = this.rnd() * Math.PI;

    const layer = (size, color, opacity, ratio) => {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: this.cloudTex, color, transparent: true, opacity,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      s.scale.set(size, size * ratio, 1);
      group.add(s);
    };

    const ratio = data.type.includes('ESPIRAL') ? 0.38 : data.type.includes('IRREGULAR') ? 0.68 : 0.82;
    layer(data.radius * 2.6, data.color, 0.26, ratio);
    layer(data.radius * 1.05, '#fff1d0', 0.42, ratio * 0.9);

    if (data.type.includes('ESPIRAL')) {
      const count = 1300;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const warm = new THREE.Color('#ffe1a6');
      const cool = new THREE.Color(data.color);
      const color = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const arm = i % 2;
        const radius = Math.pow(this.rnd(), 0.55) * data.radius * 1.2;
        const angle = arm * Math.PI + radius * 0.19 + gauss(this.rnd) * 0.22;
        const i3 = i * 3;
        positions[i3] = Math.cos(angle) * radius;
        positions[i3 + 1] = Math.sin(angle) * radius * 0.48;
        positions[i3 + 2] = gauss(this.rnd) * data.radius * 0.04;
        color.copy(cool).lerp(warm, Math.pow(1 - radius / (data.radius * 1.2), 2));
        colors[i3] = color.r; colors[i3 + 1] = color.g; colors[i3 + 2] = color.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const arms = new THREE.Points(geometry, new THREE.PointsMaterial({
        map: this.starTex, size: 1.2, sizeAttenuation: true, vertexColors: true,
        transparent: true, opacity: 0.92, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      group.add(arms);
    }

    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this.flareTex, color: '#fff5df', transparent: true, opacity: 0.65,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    core.scale.setScalar(data.radius * 1.25);
    core.userData.data = data;
    group.add(core);

    this.group.add(group);
    this.bodies.push(core);
  }

  #buildFilament() {
    const positions = [];
    for (let i = 0; i < 1800; i++) {
      const t = this.rnd();
      positions.push(
        400 * t - 20,
        (this.rnd() - 0.5) * 110 * (0.3 + Math.sin(t * Math.PI)),
        -45 + (this.rnd() - 0.5) * 40
      );
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const points = new THREE.Points(geometry, new THREE.PointsMaterial({
      map: this.starTex, size: 1.1, sizeAttenuation: true, color: 0x8c9dc7,
      transparent: true, opacity: 0.38, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    this.group.add(points);
  }

  update(dt) {
    this.time += dt;
    this.group.rotation.y += dt * 0.0015;
    for (const core of this.bodies) {
      core.material.rotation += dt * 0.04;
    }
  }

  get pickables() { return this.bodies; }
}

class AlphaCentauri {
  constructor() {
    this.group = new THREE.Group();
    this.features = [];
    this.time = 0;
    this.flareTex = flareSprite();
    this.rnd = makeRandom(615);

    this.#buildStarfield();
    this.#buildBinary();
    this.#buildProxima();
  }

  #buildStarfield() {
    const positions = [];
    for (let i = 0; i < 6500; i++) {
      const r = 420 + this.rnd() * 140;
      const u = this.rnd() * 2 - 1;
      const a = this.rnd() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      positions.push(r * s * Math.cos(a), r * u, r * s * Math.sin(a));
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    this.group.add(new THREE.Points(geometry, new THREE.PointsMaterial({
      map: starSprite(32), size: 1.2, sizeAttenuation: false, color: 0xb7ceff,
      transparent: true, opacity: 0.82, depthWrite: false, blending: THREE.AdditiveBlending
    })));
  }

  #star(radius, color, flareSize) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 48, 32),
      new THREE.MeshBasicMaterial({ color })
    );
    group.add(body);
    const flare = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this.flareTex, color, transparent: true, opacity: 0.78,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    flare.scale.setScalar(flareSize);
    group.add(flare);
    return { group, body, flare };
  }

  #orbit(radius, color, opacity = 0.2) {
    const points = [];
    for (let i = 0; i <= 128; i++) {
      const a = i / 128 * Math.PI * 2;
      points.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
    }
    return new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color, transparent: true, opacity })
    );
  }

  #feature(object, info) {
    object.userData.info = info;
    this.features.push(object);
  }

  #buildBinary() {
    this.binary = new THREE.Group();
    this.group.add(this.binary);
    this.binary.add(this.#orbit(13.5, 0xffd9a0));

    const alphaA = this.#star(2.9, 0xffe5b0, 11);
    const alphaB = this.#star(2.35, 0xffbd72, 8.5);
    this.binary.add(alphaA.group, alphaB.group);
    this.alphaA = alphaA.group;
    this.alphaB = alphaB.group;

    this.#feature(alphaA.body, {
      tag: 'ALFA CENTAURI A · G2V', name: 'Rigil Kentaurus',
      sub: 'Estrella primaria del par Alfa Centauri A/B',
      desc: 'La estrella más parecida al Sol de las cercanías. Es ligeramente más masiva y luminosa, y junto con Alfa Centauri B completa una órbita mutua muy excéntrica cada 79,9 años.',
      facts: [['Masa', '1.10 M☉'], ['Radio', '1.22 R☉'], ['Temperatura', '5 790 K'], ['Luminosidad', '1.52 L☉'], ['Tipo', 'G2V']]
    });
    this.#feature(alphaB.body, {
      tag: 'ALFA CENTAURI B · K1V', name: 'Toliman',
      sub: 'Estrella secundaria del par Alfa Centauri A/B',
      desc: 'Una estrella naranja algo más pequeña y fría que el Sol. A pesar de estar separada de Alfa A por una distancia comparable a Saturno-Sol en el máximo acercamiento, el sistema puede conservar regiones planetarias estables.',
      facts: [['Masa', '0.91 M☉'], ['Radio', '0.86 R☉'], ['Temperatura', '5 260 K'], ['Luminosidad', '0.50 L☉'], ['Tipo', 'K1V']]
    });
  }

  #buildProxima() {
    this.proximaSystem = new THREE.Group();
    this.proximaSystem.position.set(42, -13, -8);
    this.group.add(this.proximaSystem);

    const star = this.#star(2.2, 0xff6048, 10);
    this.proximaSystem.add(star.group);
    this.proximaStar = star.group;

    const habitable = new THREE.Mesh(
      new THREE.RingGeometry(7.2, 8.7, 96),
      new THREE.MeshBasicMaterial({
        color: 0x61cfa5, transparent: true, opacity: 0.13,
        side: THREE.DoubleSide, depthWrite: false
      })
    );
    habitable.rotation.x = Math.PI / 2;
    this.proximaSystem.add(habitable);

    this.proximaSystem.add(this.#orbit(7.9, 0x73e0ba, 0.5));
    const planetPivot = new THREE.Group();
    this.proximaSystem.add(planetPivot);
    this.proximaPlanetPivot = planetPivot;

    const planet = new THREE.Mesh(
      new THREE.SphereGeometry(1.15, 48, 32),
      new THREE.MeshStandardMaterial({
        map: planetTexture({
          style: 'earth', seed: 424, width: 1024, height: 512,
          palette: ['#0a1d38', '#174874', '#27759b', '#487a4a', '#908158']
        }),
        roughness: 0.9, metalness: 0
      })
    );
    planet.position.x = 7.9;
    planetPivot.add(planet);
    this.proximaPlanet = planet;

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.21, 32, 24),
      new THREE.MeshBasicMaterial({ color: 0x4da7ff, transparent: true, opacity: 0.2, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    planet.add(atmosphere);

    this.#feature(star.body, {
      tag: 'PRÓXIMA CENTAURI · M5.5Ve', name: 'Próxima Centauri',
      sub: 'La estrella más cercana al Sol · 4.24 ly',
      desc: 'Una enana roja ultrafría y activa. Sus fulguraciones pueden multiplicar temporalmente su brillo, bañando a Próxima b con radiación ultravioleta y rayos X.',
      facts: [['Masa', '0.12 M☉'], ['Radio', '0.15 R☉'], ['Temperatura', '3 042 K'], ['Luminosidad', '0.0017 L☉'], ['Fulguraciones', 'frecuentes']]
    });
    this.#feature(planet, {
      tag: 'EXOPLANETA ROCOSO', name: 'Próxima Centauri b',
      sub: 'Zona habitable conservadora de Próxima Centauri',
      desc: 'Un mundo de masa mínima cercana a la Tierra. Su corta órbita lo deja sincronizado por marea: un hemisferio mira siempre a la estrella y el otro permanece en noche perpetua.',
      facts: [['Masa mínima', '1.07 M⊕'], ['Periodo', '11.186 días'], ['Distancia', '0.0485 UA'], ['Insolación', '0.65 S⊕'], ['Rotación', 'probable acople mareal']]
    });
  }

  update(dt, daysPerSecond) {
    this.time += dt;
    const years = this.time * Math.min(daysPerSecond, 30) * 0.02;
    const binaryPhase = years / 79.9 * Math.PI * 2;
    this.alphaA.position.set(Math.cos(binaryPhase) * 5.8, 0, Math.sin(binaryPhase) * 5.8);
    this.alphaB.position.set(-Math.cos(binaryPhase) * 7.7, 0, -Math.sin(binaryPhase) * 7.7);
    this.alphaA.rotation.y += dt * 0.14;
    this.alphaB.rotation.y += dt * 0.11;

    const planetPhase = this.time * Math.min(daysPerSecond, 30) * 0.18;
    this.proximaPlanetPivot.rotation.y = planetPhase;
    this.proximaPlanet.rotation.y += dt * 0.25;

    const flare = 0.72 + Math.max(0, Math.sin(this.time * 0.43) - 0.84) * 2.5;
    this.proximaStar.children[1].material.opacity = Math.min(flare, 1);
    this.proximaStar.children[1].scale.setScalar(10 * (0.85 + flare * 0.28));
  }

  get pickables() { return this.features; }
}

/* ========== discoveries.js ========== */
const STORAGE_KEY = 'galaxy-surf-discoveries-v1';

class Discoveries {
  constructor(pois, categories) {
    this.pois = pois;
    this.categories = categories.filter(category => category.id !== 'all');
    this.byId = new Map(pois.map(poi => [poi.id, poi]));
    this.data = this.#load();

    this.button = document.getElementById('btn-discoveries');
    this.panel = document.getElementById('discoveries');
    this.summary = document.getElementById('discovery-summary');
    this.progress = document.getElementById('discovery-progress');
    this.recent = document.getElementById('discovery-recent');
    this.badge = document.getElementById('discovery-badge');

    this.button.onclick = () => this.toggle();
    document.getElementById('discoveries-close').onclick = () => this.toggle(false);
    document.getElementById('discoveries-reset').onclick = () => this.reset();
    this.render();
  }

  #load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return saved && typeof saved === 'object' ? saved : {};
    } catch {
      return {};
    }
  }

  #save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
  }

  record(id, level = 'observed') {
    const poi = this.byId.get(id);
    if (!poi) return;
    const previous = this.data[id] || {};
    const rank = { observed: 1, explored: 2 };
    const upgraded = (rank[level] || 1) > (rank[previous.level] || 0);

    this.data[id] = {
      id,
      level: upgraded ? level : previous.level || level,
      firstSeen: previous.firstSeen || Date.now(),
      lastSeen: Date.now()
    };
    this.#save();
    this.render();
  }

  count() {
    return Object.keys(this.data).length;
  }

  toggle(force) {
    const open = force ?? this.panel.classList.contains('hidden');
    this.panel.classList.toggle('hidden', !open);
    if (open) this.render();
  }

  reset() {
    this.data = {};
    this.#save();
    this.render();
  }

  render() {
    const observed = this.count();
    const explored = Object.values(this.data).filter(entry => entry.level === 'explored').length;
    this.badge.textContent = observed;
    this.badge.classList.toggle('hidden', observed === 0);
    this.summary.textContent = `${observed} de ${this.pois.length} destinos registrados · ${explored} explorados`;

    this.progress.innerHTML = '';
    for (const category of this.categories) {
      const items = this.pois.filter(poi => poi.category === category.id);
      const found = items.filter(poi => this.data[poi.id]).length;
      if (!items.length) continue;

      const row = document.createElement('div');
      row.className = 'discovery-row';
      row.innerHTML = `<div><span style="--category:${category.color}">${category.name}</span><b>${found}/${items.length}</b></div>`;
      const track = document.createElement('i');
      const fill = document.createElement('em');
      fill.style.width = `${(found / items.length) * 100}%`;
      fill.style.background = category.color;
      track.appendChild(fill);
      row.appendChild(track);
      this.progress.appendChild(row);
    }

    this.recent.innerHTML = '';
    const recent = Object.values(this.data)
      .sort((a, b) => b.lastSeen - a.lastSeen)
      .slice(0, 7);

    if (!recent.length) {
      this.recent.innerHTML = '<p class="discovery-empty">Aún no hay observaciones registradas.</p>';
      return;
    }

    for (const entry of recent) {
      const poi = this.byId.get(entry.id);
      if (!poi) continue;
      const item = document.createElement('div');
      item.className = 'discovery-item';
      item.innerHTML = `<i style="--tone:${poi.color}"></i><span>${poi.name}</span><b>${entry.level === 'explored' ? 'EXPLORADO' : 'OBSERVADO'}</b>`;
      this.recent.appendChild(item);
    }
  }
}

const ROUTES = [
  {
    id: 'neighborhood',
    title: 'Vecindario cósmico',
    sub: 'De nuestro hogar al sistema estelar más cercano',
    stops: ['solar', 'alphacen', 'orion'],

  },

    stops: ['solar', 'orion', 'pleiades', 'crab', 'betelgeuse'],
    note: 'El ciclo de las estrellas: nacer en una nube, brillar en grupo y terminar como supernova.'
  },
  {

    sub: 'Un viaje hacia Sagitario A*',
    stops: ['solar', 'eagle', 'cygx1', 'sgra'],
    note: 'Desde el Brazo de Orión hasta el agujero negro supermasivo central.'
  }
];

function distance(a, b) {
  const ar = a.l * Math.PI / 180, ab = a.b * Math.PI / 180;
  const br = b.l * Math.PI / 180, bb = b.b * Math.PI / 180;
  const ax = a.ly * Math.cos(ab) * Math.cos(ar);
  const ay = a.ly * Math.sin(ab);
  const az = a.ly * Math.cos(ab) * Math.sin(ar);
  const bx = b.ly * Math.cos(bb) * Math.cos(br);
  const by = b.ly * Math.sin(bb);
  const bz = b.ly * Math.cos(bb) * Math.sin(br);
  return Math.hypot(ax - bx, ay - by, az - bz);
}

function formatRouteDistance(ly) {
  if (ly < 1000) return `${ly.toLocaleString('es-ES', { maximumFractionDigits: 1 })} ly`;
  if (ly < 1e6) return `${(ly / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 })} kly`;
  return `${(ly / 1e6).toLocaleString('es-ES', { maximumFractionDigits: 2 })} Mly`;
}

class Routes {
  constructor(pois, onNavigate) {
    this.pois = new Map(pois.map(poi => [poi.id, poi]));
    this.onNavigate = onNavigate;
    this.active = null;
    this.index = 0;
    this.button = document.getElementById('btn-routes');
    this.panel = document.getElementById('routes');
    this.list = document.getElementById('routes-list');
    this.detail = document.getElementById('route-detail');
    this.stage = document.getElementById('route-stage');
    this.stageBody = document.getElementById('route-stage-body');
    this.continueButton = document.getElementById('route-continue');
    this.button.onclick = () => this.toggle();
    document.getElementById('routes-close').onclick = () => this.toggle(false);
    document.getElementById('route-stage-observe').onclick = () => this.observe();
    document.getElementById('route-stage-close').onclick = () => this.observe();
    this.continueButton.onclick = () => this.next();
    this.renderList();
  }

  toggle(force) {
    const open = force ?? this.panel.classList.contains('hidden');
    this.panel.classList.toggle('hidden', !open);
  }

  renderList() {
    this.list.innerHTML = '';
    for (const route of ROUTES) {
      const button = document.createElement('button');
      button.className = 'route-card';
      button.innerHTML = `<span>${route.stops.length} etapas</span><b>${route.title}</b><small>${route.sub}</small>`;
      button.onclick = () => this.open(route);
      this.list.appendChild(button);
    }
  }

  open(route) {
    this.active = route;
    this.index = 0;
    this.toggle(false);
    this.showStage();
  }

  showStage() {
    const route = this.active;
    if (!route) return;
    const stops = route.stops.map(id => this.pois.get(id));
    const poi = stops[this.index];
    const leg = this.index ? distance(stops[this.index - 1], poi) : 0;
    const fromSun = poi.ly;

    this.stageBody.innerHTML = `<span>RUTA · ${route.title.toUpperCase()}</span>
      <div class="route-stage-count">ETAPA ${this.index + 1} / ${stops.length}</div>
      <h2>${poi.name}</h2>
      <p>${poi.desc}</p>
      <div class="route-stage-data">
        <div><label>Desde el Sol</label><b>${formatRouteDistance(fromSun)}</b></div>
        <div><label>${this.index ? `Desde ${stops[this.index - 1].name}` : 'Inicio de ruta'}</label><b>${this.index ? formatRouteDistance(leg) : '0 ly'}</b></div>
      </div>`;
    document.getElementById('route-stage-observe').textContent = `Ver ${poi.name}`;
    this.stage.classList.remove('hidden');
    this.continueButton.classList.add('hidden');
  }

  observe() {
    if (!this.active) return;
    const poi = this.pois.get(this.active.stops[this.index]);
    this.stage.classList.add('hidden');
    this.onNavigate(poi);
    this.continueButton.textContent = this.index === this.active.stops.length - 1
      ? 'Finalizar ruta'
      : `Continuar · etapa ${this.index + 2}/${this.active.stops.length}`;
    this.continueButton.classList.remove('hidden');
  }

  next() {
    if (!this.active) return;
    if (this.index === this.active.stops.length - 1) {
      this.active = null;
      this.continueButton.classList.add('hidden');
      return;
    }
    this.index += 1;
    this.showStage();
  }

  go(index) {
    this.index = index;
    const poi = this.pois.get(this.active.stops[index]);
    this.onNavigate(poi);
  }
}

/* ========== ui.js ========== */
const $ = id => document.getElementById(id);

class UI {
  constructor() {
    this.el = {
      labels: $('labels'), panel: $('panel'), panelTag: $('panel-tag'),
      panelTitle: $('panel-title'), panelSub: $('panel-sub'), panelBody: $('panel-body'),
      panelAction: $('panel-action'), panelClose: $('panel-close'),
      back: $('btn-back'), fade: $('fade'),
      localGroup: $('btn-local-group'),
      routes: $('btn-routes'),
      navigator: $('navigator'), navToggle: $('nav-toggle'), navCurrent: $('nav-current'),
      navInput: $('nav-input'), navList: $('nav-list'), navChips: $('nav-chips'),
      navCount: $('nav-count'),
      loader: $('loader'), hint: $('hint'), reticle: $('reticle'),
      context: $('hud-context'), statScale: $('stat-scale'),
      statTarget: $('stat-target'), statDistance: $('stat-distance'),
      orbitsBtn: document.querySelector('[data-action="orbits"]'),
      labelsBtn: document.querySelector('[data-action="labels"]'),
      speed: $('speed'), speedValue: $('speed-value')
    };
    this.labels = [];
    this.showLabels = true;
    this._v = new THREE.Vector3();

    this.el.panelClose.onclick = () => this.hidePanel();
  }

  /* ---------------- Panel ---------------- */
  showPanel(info, onAction) {
    const e = this.el;
    e.panelTag.textContent = info.tag || 'OBJETO';
    e.panelTitle.textContent = info.name;
    e.panelSub.textContent = info.sub || '';

    let html = '';
    if (info.desc) html += `<p class="desc">${info.desc}</p>`;
    if (info.facts?.length) {
      html += '<div class="facts">' + info.facts
        .map(([k, v]) => `<div class="fact"><label>${k}</label><span>${v}</span></div>`)
        .join('') + '</div>';
    }
    if (info.moons?.length) {
      html += '<div class="moons"><h3>Satélites principales</h3>' + info.moons
        .map(m => `<div class="moon-row"><b>${m.name}</b><span>${m.note || (m.radiusKm + ' km')}</span></div>`)
        .join('') + '</div>';
    }
    e.panelBody.innerHTML = html;

    if (onAction) {
      e.panelAction.classList.remove('hidden');
      e.panelAction.textContent = info.actionLabel || 'Explorar';
      e.panelAction.onclick = onAction;
    } else {
      e.panelAction.classList.add('hidden');
      e.panelAction.onclick = null;
    }
    e.panel.classList.remove('hidden');
  }

  hidePanel() { this.el.panel.classList.add('hidden'); }

  /* ---------------- Navegador de destinos ---------------- */
  buildNavigator(categories, items, onSelect, onFilter) {
    this.navItems = items;
    this.filter = 'all';
    this.query = '';
    this.activeIndex = 0;
    this.onNavSelect = onSelect;
    this.onNavFilter = onFilter;

    const e = this.el;
    e.navChips.innerHTML = '';
    for (const cat of categories) {
      const chip = document.createElement('button');
      chip.className = 'nav-chip' + (cat.id === 'all' ? ' on' : '');
      chip.textContent = cat.name;
      chip.style.setProperty('--chip', cat.color);
      chip.onclick = () => {
        this.filter = cat.id;
        e.navChips.querySelectorAll('.nav-chip').forEach(c => c.classList.toggle('on', c === chip));
        this.renderNav();
        onFilter?.(cat.id);
      };
      e.navChips.appendChild(chip);
    }

    e.navInput.addEventListener('input', () => {
      this.query = e.navInput.value.trim().toLowerCase();
      this.activeIndex = 0;
      this.renderNav();
    });

    e.navInput.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        this.moveNav(ev.key === 'ArrowDown' ? 1 : -1);
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        const it = this.visibleNav?.[this.activeIndex];
        if (it) { this.onNavSelect(it); this.toggleNav(false); }
      } else if (ev.key === 'Escape') {
        ev.preventDefault();
        this.toggleNav(false);
      }
    });

    e.navToggle.onclick = () => this.toggleNav();
    this.renderNav();
  }

  /** Normaliza para buscar sin acentos */
  static norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  renderNav() {
    const q = UI.norm(this.query);
    this.visibleNav = this.navItems.filter(it => {
      if (this.filter !== 'all' && it.category !== this.filter) return false;
      if (!q) return true;
      return UI.norm(it.name).includes(q) || UI.norm(it.tag).includes(q);
    });

    const list = this.el.navList;
    list.innerHTML = '';
    this.el.navCount.textContent = `${this.visibleNav.length}/${this.navItems.length}`;

    if (!this.visibleNav.length) {
      list.innerHTML = '<div class="nav-empty">Sin resultados</div>';
      return;
    }

    let lastGroup = null;
    this.visibleNav.forEach((it, i) => {
      if (it.groupName !== lastGroup && !q) {
        const h = document.createElement('div');
        h.className = 'nav-group';
        h.textContent = it.groupName;
        list.appendChild(h);
        lastGroup = it.groupName;
      }
      const b = document.createElement('button');
      b.className = 'nav-item' + (i === this.activeIndex ? ' active' : '') + (it.id === this.currentId ? ' current' : '');
      b.style.setProperty('--tone', it.color);
      b.innerHTML =
        `<i></i><span class="nav-name">${it.name}</span>` +
        (it.unlocked ? '<span class="nav-go">Explorar</span>' : '') +
        `<span class="nav-meta">${it.distance}</span>`;
      b.onclick = () => { this.onNavSelect(it); this.toggleNav(false); };
      b.onmouseenter = () => { this.activeIndex = i; this.markActive(); };
      list.appendChild(b);
    });
  }

  markActive() {
    const nodes = this.el.navList.querySelectorAll('.nav-item');
    nodes.forEach((n, i) => n.classList.toggle('active', i === this.activeIndex));
  }

  moveNav(dir) {
    if (!this.visibleNav?.length) return;
    this.activeIndex = (this.activeIndex + dir + this.visibleNav.length) % this.visibleNav.length;
    this.markActive();
    this.el.navList.querySelectorAll('.nav-item')[this.activeIndex]
      ?.scrollIntoView({ block: 'nearest' });
  }

  toggleNav(force) {
    const open = force ?? this.el.navigator.classList.contains('closed');
    this.el.navigator.classList.toggle('closed', !open);
    if (open) {
      this.el.navInput.focus();
      this.el.navInput.select();
    } else {
      this.el.navInput.blur();
    }
    return open;
  }

  get navOpen() { return !this.el.navigator.classList.contains('closed'); }

  setNavCurrent(id, label) {
    this.currentId = id;
    this.el.navCurrent.textContent = label || 'Destinos';
    this.el.navList.querySelectorAll('.nav-item').forEach((n, i) => {
      n.classList.toggle('current', this.visibleNav?.[i]?.id === id);
    });
  }

  /* ---------------- Etiquetas 3D ---------------- */
  clearLabels() {
    this.el.labels.innerHTML = '';
    this.labels = [];
  }

  addLabel(object3D, text, cls, opts = {}) {
    const div = document.createElement('div');
    div.className = 'label ' + cls;
    div.innerHTML = `<span class="dot">${opts.pulse ? '<span class="ring"></span>' : ''}</span>${text}`;
    if (opts.onClick) div.onclick = e => { e.stopPropagation(); opts.onClick(); };
    this.el.labels.appendChild(div);
    const entry = {
      object3D, div,
      minDist: opts.minDist ?? 0,
      maxDist: opts.maxDist ?? Infinity,
      offset: opts.offset ?? 0,
      priority: opts.priority ?? 0,
      width: opts.width ?? 130
    };
    this.labels.push(entry);
    return entry;
  }

  updateLabels(camera, width, height) {
    if (!this.showLabels) return;
    const v = this._v;
    const placed = [];

    // Se resuelven primero las prioritarias y las más cercanas a la cámara
    const queue = this.labels
      .map(l => {
        l.object3D.getWorldPosition(v);
        const dist = camera.position.distanceTo(v);
        v.project(camera);
        return { l, dist, x: (v.x * 0.5 + 0.5) * width, y: (-v.y * 0.5 + 0.5) * height, front: v.z < 1 };
      })
      .sort((a, b) => (b.l.priority - a.l.priority) || (a.dist - b.dist));

    for (const it of queue) {
      const l = it.l;
      const visible = it.front && it.dist > l.minDist && it.dist < l.maxDist;
      if (!visible) { l.div.style.display = 'none'; continue; }

      // Anti-solapamiento: las de menor prioridad ceden el sitio
      let blocked = false;
      if (l.priority < 2) {
        for (const p of placed) {
          if (Math.abs(p.x - it.x) < (p.w + l.width) * 0.42 && Math.abs(p.y - it.y) < 17) {
            blocked = true;
            break;
          }
        }
      }
      if (blocked) { l.div.style.display = 'none'; continue; }

      placed.push({ x: it.x, y: it.y, w: l.width });
      l.div.style.display = '';
      l.div.style.left = it.x + 'px';
      l.div.style.top = (it.y - l.offset) + 'px';
      l.div.style.opacity = Math.min(1, Math.max(0.25, 1 - it.dist / (l.maxDist * 0.95)));
    }
  }

  setLabelsVisible(v) {
    this.showLabels = v;
    this.el.labels.style.display = v ? '' : 'none';
    this.el.labelsBtn.classList.toggle('active', v);
  }

  /* ---------------- Varios ---------------- */
  setContext(text) { this.el.context.textContent = text; }
  setScale(text) { this.el.statScale.textContent = text; }
  setTarget(text) { this.el.statTarget.textContent = text || '—'; }
  setDistance(text) { this.el.statDistance.textContent = text || '—'; }

  setReticle(x, y, on) {
    this.el.reticle.classList.toggle('on', on);
    if (on) { this.el.reticle.style.left = x + 'px'; this.el.reticle.style.top = y + 'px'; }
  }

  fade(on) { this.el.fade.classList.toggle('on', on); }
  hideLoader() { this.el.loader.classList.add('done'); }
  hideHint() { this.el.hint.classList.add('hide'); }

  setMode(mode) {
    this.el.back.classList.toggle('hidden', mode === 'galaxy');
    this.el.localGroup.classList.toggle('hidden', mode !== 'galaxy');
    this.el.routes.classList.toggle('hidden', mode !== 'galaxy');
    this.el.orbitsBtn.classList.toggle('hidden', mode !== 'solar');
  }
}

function boot() {
  galaxy = new Galaxy();

function setupGalaxyMode(initial = false) {
  state.mode = 'galaxy';
  scene = galaxyScene;
  renderPass.scene = galaxyScene;
  bloom.strength = 0.72;
  bloom.threshold = 0.3;
  bloom.radius = 0.65;
  setResolutionScale(1);

  controls.maxDistance = 400;
  controls.target.set(0, 0, 0);

    camera.position.set(0, 92, 128);
  }

  document.getElementById('btn-back').lastChild.textContent = ' Volver a la galaxia';
  ui.setContext('Vía Láctea · Galaxia espiral barrada SBbc');

  ui.clearLabels();
  ui.setNavCurrent(null);
  ui.setTarget(null);
  state.followBody = null;

  refreshGalaxyLabels();

/** Etiquetas de la galaxia: explorables siempre, el resto según el filtro */
function refreshGalaxyLabels() {
  if (state.mode !== 'galaxy') return;
  ui.clearLabels();

  for (const m of galaxy.markers) {
    const poi = m.userData.poi;
    const inFilter = state.filter === 'all' || poi.category === state.filter;
    if (!poi.explorable && !inFilter) continue;

    ui.addLabel(m, poi.name, poi.explorable ? 'poi' : 'locked', {
      pulse: poi.explorable,
      priority: poi.explorable ? 2 : (inFilter ? 1 : 0),
      width: poi.name.length * 7 + 26,
      onClick: () => selectPOI(poi)
    });
  }

  for (const background of galaxy.backgroundGalaxies) {
    const item = background.userData.galaxy;
    ui.addLabel(background, item.name, 'locked', {
      priority: -1,
      width: item.name.length * 7 + 26
    });
  }
}

/** Posición en coordenadas de mundo del marcador de un POI (la galaxia rota) */
function poiWorldPosition(poi) {
  const marker = galaxy.markers.find(m => m.userData.poi === poi);
  return marker.getWorldPosition(new THREE.Vector3());
}

function poiMarker(poi) {
  return galaxy.markers.find(m => m.userData.poi === poi);
}

function selectPOI(poi) {
  state.selected = poi;
  discoveries.record(poi.id, 'observed');
  applyIsolation();
  ui.setTarget(poi.name);
  ui.setNavCurrent(poi.id, poi.name);
  ui.showPanel({
    tag: poi.tag,
    name: poi.name,
    sub: poi.sub,
    desc: poi.desc + (poi.explorable ? '' : ' · Exploración detallada no disponible todavía.'),
    facts: poi.facts,
    actionLabel: poi.actionLabel || 'Explorar sistema'
  }, poi.explorable ? () => enterDestination(poi) : null);

  // Todos los destinos se encuadran por tamaño visual; la exploración detallada
  // empieza después, al pulsar la acción de la ficha.
  const dist = clamp(poi.size * 3.8, 0.9, 8);
  flyTo(poiWorldPosition(poi), dist, 1.6, poiMarker(poi));
}

function navigateRoute(poi) {
  if (state.mode === 'galaxy') {
    selectPOI(poi);
    ui.hidePanel();
    return;
  }

  exitToGalaxy();
  setTimeout(() => {
    selectPOI(poi);
    ui.hidePanel();
  }, 900);
}

function selectAlphaFeature(feature) {
  const info = feature.userData.info;
  state.selected = { obj: feature, data: info };
  ui.setTarget(info.name);
  ui.showPanel(info);
  flyTo(feature.getWorldPosition(new THREE.Vector3()), info.name === 'Próxima Centauri b' ? 7 : 11, 1.3, feature);
}

/* ================================================================
 *  Modo Grupo Local
 * ================================================================ */
function setupLocalGroupMode() {
  state.mode = 'localgroup';
  scene = localGroupScene;
  renderPass.scene = localGroupScene;
  bloom.strength = 0.78;
  bloom.threshold = 0.34;
  bloom.radius = 0.7;
  setResolutionScale(1);

  controls.minDistance = 30;
  controls.maxDistance = 1300;
  controls.target.set(190, 0, -25);
  controls.enablePan = true;

  ui.setMode('localgroup');
  document.getElementById('btn-back').lastChild.textContent = ' Explorar la Vía Láctea';
  ui.setContext('Grupo Local · ~ 60 galaxias ligadas gravitacionalmente');
  ui.setScale('~ 5 millones de años luz');
  ui.clearLabels();
  ui.setTarget('Grupo Local');

  for (const body of localGroup.bodies) {
    const data = body.userData.data;
    ui.addLabel(body, data.name, data.explorable ? 'poi' : 'locked', {
      pulse: data.explorable,
      priority: data.explorable ? 2 : 1,
      width: data.name.length * 7 + 26,
      onClick: () => selectLocalGalaxy(body)
    });
  }
  ui.setLabelsVisible(ui.showLabels);
}

function selectLocalGalaxy(body) {
  const data = body.userData.data;
  state.selected = { obj: body, data };
  ui.setTarget(data.name);
  ui.showPanel({
    tag: data.type, name: data.name,
    sub: data.explorable ? 'Nuestra galaxia · acceso disponible' : 'Grupo Local · exploración próximamente',
    desc: data.desc, facts: data.facts,
    actionLabel: 'Explorar Vía Láctea'
  }, data.explorable ? () => enterMilkyWay() : null);
  flyTo(body.getWorldPosition(new THREE.Vector3()), data.radius * 4.4, 1.5, body);
}

function enterLocalGroup() {
  if (state.transitioning) return;
  state.transitioning = true;
  ui.hidePanel();
  ui.fade(true);
  setTimeout(() => {
    setupLocalGroupMode();
    camera.position.set(0, 105, 350);
    controls.target.set(0, 0, 0);
    controls.update();
    ui.fade(false);
    state.transitioning = false;
  }, 550);
}

function enterMilkyWay() {
  if (state.mode !== 'localgroup') return;
  state.transitioning = true;
  ui.hidePanel();
  ui.fade(true);
  setTimeout(() => {
    setupGalaxyMode(true);
    controls.update();
    ui.fade(false);
    state.transitioning = false;
  }, 550);
}

/* ================================================================
 *  Transiciones entre escenas
 * ================================================================ */
const DESTINATIONS = {
  solar: {
    setup: setupSolarMode,
    enter: { pos: [0, 34, 96], fly: { dist: 118, dur: 2.2 } },
    back: { dist: 190, dir: [0, 120, 150] }
  },
  blackhole: {
    setup: setupBlackHoleMode,
    enter: { pos: [0, 4.5, 22], fly: { dist: 46, dur: 2.6 } },
    back: { dist: 190, dir: [0, 120, 150] }
  },
  orion: {
    setup: setupOrionMode,
    enter: { pos: [0, 12, 42], fly: { dist: 46, dur: 2.5 } },
    back: { dist: 190, dir: [0, 120, 150] }
  },
  alphacen: {
    setup: setupAlphaCentauriMode,
    enter: { pos: [9, 17, 72], fly: { dist: 72, dur: 2.3 } },
    back: { dist: 190, dir: [0, 120, 150] }
  }
};

function destinationKey(poi) {
  if (poi.id === 'sgra') return 'blackhole';
  return poi.id;
}

function enterDestination(poi) {
  const key = destinationKey(poi);
  const dest = DESTINATIONS[key];
  if (!dest || state.transitioning) return;

  state.transitioning = true;
  state.destination = poi;
  document.getElementById('btn-local-group').classList.add('hidden');
  discoveries.record(poi.id, 'explored');
  ui.hidePanel();

  flyTo(poiWorldPosition(poi), 2.2, 1.5, null, () => {
    ui.fade(true);
    setTimeout(() => {
      dest.setup();
      camera.position.fromArray(dest.enter.pos);
      const entryTarget = new THREE.Vector3(0, 0, 0);
      controls.target.copy(entryTarget);
      controls.update();
      ui.fade(false);
      state.transitioning = false;
      flyTo(entryTarget, dest.enter.fly.dist, dest.enter.fly.dur);
    }, 600);
  });
}

function exitToGalaxy() {
  if (state.transitioning) return;
  const poi = state.destination || POIS.find(p => p.id === 'solar');
  const dest = DESTINATIONS[destinationKey(poi)];

  state.transitioning = true;
  ui.hidePanel();
  ui.fade(true);
  setTimeout(() => {
    setupGalaxyMode();
    const p = poiWorldPosition(poi);
    camera.position.set(p.x * 1.06 || 6, p.y + 3, p.z * 1.06 || 6);
    controls.target.copy(p);
    controls.update();
    ui.fade(false);
    state.transitioning = false;
    flyTo(new THREE.Vector3(0, 0, 0), dest.back.dist, 2.6, null, null,
      new THREE.Vector3().fromArray(dest.back.dir));
  }, 600);
}

/** Baja la resolución interna del composer sin tocar el tamaño del canvas */
function setResolutionScale(scale) {
  const pr = Math.min(devicePixelRatio, 2) * scale;
  composer.setPixelRatio(pr);
  composer.setSize(innerWidth, innerHeight);
}

/* ================================================================
 *  Vuelo de cámara
 * ================================================================ */
function flyTo(targetPoint, distance, duration = 1.4, follow = null, onDone = null, dirHint = null) {
  const dir = dirHint
    ? dirHint.clone().normalize()
    : camera.position.clone().sub(targetPoint).normalize();
  if (!isFinite(dir.x) || dir.lengthSq() < 1e-6) dir.set(0.4, 0.5, 0.8).normalize();

  state.flight = {
    t: 0, duration, dir, distance,
    fromPos: camera.position.clone(),
    fromTarget: controls.target.clone(),
    toTarget: targetPoint.clone(),
    follow, onDone
  };
  state.followBody = null;
  controls.enabled = false;
}

const _toPos = new THREE.Vector3();

function updateFlight(dt) {
  const f = state.flight;
  if (!f) return;
  f.t += dt;
  const k = easeInOut(clamp(f.t / f.duration, 0, 1));

  // Si seguimos un cuerpo en órbita, el destino se recalcula cada fotograma
  if (f.follow) f.follow.getWorldPosition(f.toTarget);

  _toPos.copy(f.toTarget).addScaledVector(f.dir, f.distance);
  camera.position.lerpVectors(f.fromPos, _toPos, k);
  controls.target.lerpVectors(f.fromTarget, f.toTarget, k);

  if (f.t >= f.duration) {
    state.flight = null;
    controls.enabled = true;
    state.followBody = f.follow;
    f.onDone?.();
  }
}

/* Mantiene el encuadre sobre un cuerpo en movimiento */
const _fw = new THREE.Vector3();
const _prev = new THREE.Vector3();
function updateFollow() {
  if (!state.followBody || state.flight) return;
  const target = state.followBody;
  _prev.copy(controls.target);
  target.getWorldPosition(_fw);
  const delta = _fw.clone().sub(_prev);
  controls.target.copy(_fw);
  camera.position.add(delta);
}

/* ================================================================
 *  Interacción
 * ================================================================ */
let downPos = null;

canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });

function pickList() {
  if (state.mode === 'galaxy') return galaxy.markers;
  if (state.mode === 'solar') return solar.pickables;
  if (state.mode === 'orion') return orion.pickables;
  if (state.mode === 'alphacentauri') return alphaCentauri.pickables;
  if (state.mode === 'localgroup') return localGroup.pickables;
  return [];
}

canvas.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6 || state.transitioning) return;

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const hit = raycaster.intersectObjects(pickList(), false)[0];
  if (!hit) return;

  if (state.mode === 'galaxy') {
    selectPOI(hit.object.userData.poi);
  } else if (state.mode === 'solar') {
    const b = solar.bodies.find(x => x.obj === hit.object);
    if (b) selectBody(b);
  } else if (state.mode === 'orion') {
    selectOrionFeature(hit.object);
  } else if (state.mode === 'alphacentauri') {
    selectAlphaFeature(hit.object);
  } else if (state.mode === 'localgroup') {
    selectLocalGalaxy(hit.object);
  }
});

canvas.addEventListener('pointermove', e => {
  if (state.transitioning) { ui.setReticle(0, 0, false); return; }
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickList(), false)[0];
  ui.setReticle(e.clientX, e.clientY, !!hit);
  canvas.style.cursor = hit ? 'pointer' : '';
});

document.getElementById('btn-back').onclick = () => {
  if (state.mode === 'localgroup') enterMilkyWay();
  else exitToGalaxy();
};
document.getElementById('btn-local-group').onclick = enterLocalGroup;

/* Herramientas de vista */
document.querySelectorAll('#view-tools button').forEach(btn => {
  btn.onclick = () => {
    const a = btn.dataset.action;
    if (a === 'top') {
      const d = camera.position.distanceTo(controls.target);
      flyTo(controls.target.clone(), d, 1.2, state.followBody, null, new THREE.Vector3(0, 1, 0.001));
    } else if (a === 'edge') {
      const d = camera.position.distanceTo(controls.target);
      flyTo(controls.target.clone(), d, 1.2, state.followBody, null, new THREE.Vector3(0.02, 0.06, 1));
    } else if (a === 'labels') {
      ui.setLabelsVisible(!ui.showLabels);
    } else if (a === 'orbits') {
      const on = !btn.classList.contains('active');
      btn.classList.toggle('active', on);
      solar.setOrbitsVisible(on);
    }
  };
});

/* Velocidad temporal */
ui.el.speed.addEventListener('input', e => {
  state.daysPerSecond = Number(e.target.value);
  ui.el.speedValue.textContent = state.daysPerSecond === 0
    ? 'PAUSA'
    : state.daysPerSecond + ' d/s';
});

const focusSlider = document.getElementById('focus');
const focusValue = document.getElementById('focus-value');

function applyIsolation() {
  if (!solar) return;
  if (state.mode === 'solar') {
    solar.setFocus(state.selected?.obj, state.isolation);
  } else if (state.mode === 'galaxy') {
    galaxy.setFocus(state.selected, state.isolation);
    landmarks.setFocus(state.selected, state.isolation);
  }
}

focusSlider.addEventListener('input', e => {
  state.isolation = Number(e.target.value) / 100;
  focusValue.textContent = Math.round(state.isolation * 100) + '%';
  applyIsolation();
});

/* Navegador de destinos */
const CATEGORY_NAME = Object.fromEntries(CATEGORIES.map(c => [c.id, c.name]));

function formatLy(ly) {
  if (ly === 0) return '0 ly';
  if (ly < 1000) return ly.toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' ly';
  if (ly < 1e6) return Math.round(ly / 1000).toLocaleString('es-ES') + ' kly';
  return (ly / 1e6).toFixed(1) + ' Mly';
}

function buildNavigator() {
  const order = ['sistema', 'nebulosa', 'cumulo', 'remanente', 'exotico', 'estructura'];
  const items = POIS
    .map(p => ({
      id: p.id, name: p.name, tag: p.tag, category: p.category,
      groupName: CATEGORY_NAME[p.category],
      color: p.color, unlocked: p.explorable,
      distance: formatLy(p.ly), poi: p
    }))
    .sort((a, b) =>
      (b.unlocked - a.unlocked) ||
      (order.indexOf(a.category) - order.indexOf(b.category)) ||
      (a.poi.ly - b.poi.ly)
    );

  ui.buildNavigator(CATEGORIES, items, item => {
    if (state.mode !== 'galaxy') {
      exitToGalaxy();
      setTimeout(() => selectPOI(item.poi), 900);
    } else {
      selectPOI(item.poi);
    }
  }, filter => {
    state.filter = filter;
    galaxy.setFilter(filter);
    refreshGalaxyLabels();
  });

  state.navOrder = items.map(i => i.poi);
}

/** Salta al destino anterior o siguiente de la lista */
function stepDestination(dir) {
  if (state.mode !== 'galaxy' || !state.navOrder) return;
  const list = state.navOrder;
  const i = list.indexOf(state.selected);
  selectPOI(list[(i + dir + list.length) % list.length]);
}

/* Resize */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  setResolutionScale(state.mode === 'blackhole' ? 0.72 : 1);
  bloom.setSize(innerWidth, innerHeight);
});

/* Atajos */
addEventListener('keydown', e => {
  const typing = e.target === ui.el.navInput;

  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    ui.toggleNav();
    return;
  }
  if (typing) return;

  if (e.key === '/' || e.key === 'k' || e.key === 'K') {
    e.preventDefault();
    ui.toggleNav(true);
  } else if (e.key === 'Escape') {
    if (ui.navOpen) ui.toggleNav(false);
    else {
      ui.hidePanel();
      if (state.mode !== 'galaxy') exitToGalaxy();
    }
  } else if (e.key === 'l' || e.key === 'L') {
    ui.setLabelsVisible(!ui.showLabels);
  } else if (e.key === '[') {
    stepDestination(-1);
  } else if (e.key === ']') {
    stepDestination(1);
  }
});

/* ================================================================
 *  Bucle principal
 * ================================================================ */
const clock = new THREE.Clock();

function formatDistance() {
  const d = camera.position.distanceTo(controls.target);
  if (state.mode === 'galaxy') {
    return (d * 1000).toLocaleString('es-ES', { maximumFractionDigits: 0 }) + ' ly';
  }
  if (state.mode === 'blackhole') {
    return d.toFixed(1) + ' rₛ';
  }
  if (state.mode === 'orion') {
    return d.toFixed(d < 10 ? 1 : 0) + ' ly';
  }
  if (state.mode === 'localgroup') {
    const mly = d * 0.00686;
    return mly.toFixed(mly < 1 ? 2 : 1) + ' Mly';
  }
  const au = d > 14 ? Math.pow((d - 14) / 26, 1 / 0.62) : d / 14 * 0.1;
  return au.toFixed(au < 10 ? 2 : 1) + ' UA';
}

let statTick = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateFlight(dt);
  updateFollow();
  controls.update();

  if (state.mode === 'galaxy') {
    galaxy.update(dt, state.daysPerSecond, camera);
    landmarks.update(dt);
  } else if (state.mode === 'solar') {
    solar.update(dt, state.daysPerSecond);
  } else if (state.mode === 'orion') {
    orion.update(dt, state.daysPerSecond);
  } else if (state.mode === 'alphacentauri') {
    alphaCentauri.update(dt, state.daysPerSecond);
  } else if (state.mode === 'localgroup') {
    localGroup.update(dt);
  } else {
    blackhole.update(dt, camera, state.daysPerSecond);
  }

  ui.updateLabels(camera, innerWidth, innerHeight);

  statTick += dt;
  if (statTick > 0.12) {
    statTick = 0;
    ui.setDistance(formatDistance());
  }

  composer.render();
}

/* Arranque diferido para que se pinte el loader */
setTimeout(boot, 60);
</script>
